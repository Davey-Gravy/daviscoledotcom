baseURL = 'https://daviscole.com/'
locale = 'en-us'
title = 'Davis Cole'
enableGitInfo = true

[params]
description = "Davis Cole"
images = ["avatar.png"]

# Manual frontmatter only — :git is intentionally omitted so that the existing
# repo-wide commit timestamp doesn't appear as a fake "Updated" date on every
# post. Add `:git` back once existing posts have explicit lastmod values, or
# rely on the lastUpdated/lastmod fields per post.
[frontmatter]
lastmod = ["lastmod", "lastUpdated", "date"]

[outputs]
home = ["HTML", "RSS", "JSON"]

[related]
threshold = 80
includeNewer = true
toLower = true
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10

[[menus.main]]
name = 'About'
pageRef = '/about'
weight = 20

[[menus.main]]
name = 'Projects'
pageRef = '/projects'
weight = 30

[[menus.main]]
name = 'Posts'
pageRef = '/posts'
weight = 40

[[menus.main]]
name = 'Updates'
pageRef = '/updates'
weight = 50

[[menus.main]]
name = 'Books'
pageRef = '/books'
weight = 60

[[menus.social]]
name = "YouTube"
identifier = "youtube"
url = "https://youtube.com/@davis.cole17"
weight = 1

[[menus.social]]
name = "GitHub"
identifier = "github"
url = "https://github.com/Davey-Gravy"
weight = 2

[[menus.social]]
name = "LinkedIn"
identifier = "linkedin"
url = "https://linkedin.com/in/davis-cole17"
weight = 3

[[menus.social]]
name = "Twitter"
identifier = "twitter"
url = "https://x.com/dcool_io"
weight = 4

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
